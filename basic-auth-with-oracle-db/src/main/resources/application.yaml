spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: HikariCP
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    generate-ddl: true
  thymeleaf:
    cache: false

server:
  port: 8080